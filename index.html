<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地底の竜 -XANADU-like-</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="screen" width="640" height="416"></canvas>
    <div id="menu" class="hidden"></div>
  </div>
  <div id="hud"></div>
  <div id="log"></div>
  <div id="help">
    ← → 移動 ／ ↑ ↓ はしご・扉に入る ／ Z・Space ジャンプ（部屋では階段を出る） ／ X 魔法 ／ Q 魔法切替 ／ D つるはし（↓＋D で足元）<br>
    A 薬 ／ S 魔法の水 ／ V 道具 ／ C ステータス ／ Esc ポーズ ／ 敵には<b>体当たり</b>で攻撃！<br>
    メニューは ↑↓ で選択、Z・Enter で決定、X・Esc で戻る
  </div>
</div>
<script src="js/sprites.js"></script>
<script src="js/data.js"></script>
<script src="js/maps.js"></script>
<script src="js/game.js"></script>
</body>
</html>
