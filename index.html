<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<title>レトロゲーム集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css?v=2">
</head>
<body>
<header>
  <h1>レトロゲーム集</h1>
  <p>ブラウザですぐ遊べる、レトロゲーム風の小さなゲームたち。パソコンでもスマホでも遊べます。</p>
</header>
<main id="games">
  <noscript>
    <ul>
      <li><a href="underground-dragon/index.html">地底の竜</a></li>
      <li><a href="airport-controller/index.html">エアポート管制官</a></li>
      <li><a href="tank-defense/index.html">鉄壁の砲台</a></li>
    </ul>
  </noscript>
</main>
<footer>
  <a href="https://github.com/mo-kazuya/MyGame">GitHub リポジトリ</a>
</footer>
<script src="games.js?v=4"></script>
<script>
  // games.js の一覧からカードを作る
  (function () {
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    document.getElementById('games').innerHTML = GAMES.map(g => {
      const href = `${g.dir}/index.html`;
      return `<a class="card" href="${esc(href)}">
        <div class="thumb">${g.thumb ? `<img src="${esc(g.dir + '/' + g.thumb)}" alt="" loading="lazy">` : `<span>${esc(g.title)}</span>`}</div>
        <div class="body">
          <h2>${esc(g.title)}</h2>
          <p class="genre">${esc(g.genre)}${g.inspired ? `<span>・${esc(g.inspired)}風</span>` : ''}</p>
          <p class="desc">${esc(g.desc)}</p>
          <p class="tags">${(g.tags || []).map(t => `<span>${esc(t)}</span>`).join('')}</p>
          <span class="play">▶ あそぶ</span>
        </div>
      </a>`;
    }).join('');
  })();
</script>
</body>
</html>
