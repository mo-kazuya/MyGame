<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#10241c">
<title>くねくねスネーク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>
<div id="top">
  <button id="pause" title="ポーズ（P / Esc）">Ⅱ</button>
  <div class="stat"><span class="lbl">スコア</span><b id="score">0</b></div>
  <div class="stat"><span class="lbl">長さ</span><b id="len">0</b></div>
  <div class="stat"><span class="lbl">ハイスコア</span><b id="best">0</b></div>
  <span class="grow"></span>
  <button id="sound" title="音のオン・オフ">♪</button>
</div>
<div id="field"><canvas id="screen"></canvas></div>
<div id="pad">
  <button data-dir="up" aria-label="上">▲</button>
  <button data-dir="left" aria-label="左">◀</button>
  <button data-dir="down" aria-label="下">▼</button>
  <button data-dir="right" aria-label="右">▶</button>
</div>
<div id="overlay"></div>
<script src="game.js?v=1.0"></script>
</body>
</html>
