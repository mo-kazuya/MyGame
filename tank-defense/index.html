<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#22301a">
<title>鉄壁の砲台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1.1">
</head>
<body>
<div id="top">
  <button id="pause" title="ポーズ（P / Esc）">Ⅱ</button>
  <div class="stat"><span class="lbl">資金</span><b id="money">0</b></div>
  <div class="stat"><span class="lbl">基地</span><b id="lives">0</b></div>
  <div class="stat"><span class="lbl">ウェーブ</span><b id="wave">0</b></div>
  <span class="grow"></span>
  <button id="speed" title="スピード（+ / -）">×1</button>
  <button id="sound" title="音のオン・オフ">♪</button>
</div>
<div id="field"><canvas id="screen"></canvas><div id="skills" class="hidden"></div></div>
<div id="tray">
  <div id="tools"></div>
  <button id="next" title="次のウェーブ（Space）">▶ 出撃</button>
</div>
<div id="overlay"></div>
<script src="game.js?v=1.3"></script>
</body>
</html>
